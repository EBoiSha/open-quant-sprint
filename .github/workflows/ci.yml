name: Causal Audit & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    name: Pytest & 7-Stage Causal Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Use main for everything except contributed strategy and contrib files
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'valiyevoktay-cmd'
        run: |
          git fetch origin main
          changed=$(git diff --name-only --diff-filter=AMR origin/main...HEAD)
          allowed=$(printf '%s\n' "$changed" \
            | grep -E '^(strategies|src/contrib)/[A-Za-z0-9_]+\.py$' \
            | grep -v -E '^(strategies/(template|baseline_flow|leaky_example)|src/contrib/__init__)\.py$' || true)
          keep="$RUNNER_TEMP/pr_files"
          mkdir -p "$keep"
          for f in $allowed; do mkdir -p "$keep/$(dirname "$f")"; cp "$f" "$keep/$f"; done
          git checkout --detach origin/main
          cp -R "$keep/." .
          printf '%s\n' "$allowed" | grep -E '^strategies/' > "$RUNNER_TEMP/pr_strategies.txt" || true
          echo "Files taken from the pull request:" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$allowed" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Run unit & regression test suite
        run: |
          python -m pytest -v tests

      - name: Audit strategies
        run: |
          # The report holds text chosen by the strategy. Workflow commands in it (lines starting with
          # "::") must not reach the runner, so the log copy goes out between stop-commands markers made
          # after the audit has finished; the summary copy is HTML-escaped so nothing in it renders.
          show_report() {
            token=$(python -c "import secrets; print(secrets.token_hex(16))")
            echo "::stop-commands::$token"
            cat audit_report.txt
            echo "::$token::"
            python -c "import html; print('<pre>' + html.escape(open('audit_report.txt', encoding='utf-8', errors='replace').read()) + '</pre>')" >> "$GITHUB_STEP_SUMMARY"
          }
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ -f "$RUNNER_TEMP/pr_strategies.txt" ]; then
              files=$(cat "$RUNNER_TEMP/pr_strategies.txt")
            else
              files=$(git diff --name-only --diff-filter=AMR origin/main...HEAD -- 'strategies/*.py' || true)
            fi
          else
            files=$(ls strategies/*.py | grep -v -e template.py -e leaky_example.py -e baseline_flow.py || true)
          fi
          status=0
          for f in $files; do
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            rc=0
            python -m src.audit "$f" > audit_report.txt 2>&1 || rc=$?
            show_report
            if [ "$rc" -ne 0 ]; then status=1; fi
          done
          if [ -z "$files" ]; then echo "No contributed strategy files to audit." >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # Merged strategies may carry any verdict; on main the audit is a report, not a gate.
            echo "Push to main: audit results are informational and do not fail the run." >> "$GITHUB_STEP_SUMMARY"
            status=0
          fi
          exit $status

      - name: Reference audit of baseline_flow.py (informational)
        if: github.event_name == 'push'
        run: |
          # The report holds text chosen by the strategy. Workflow commands in it (lines starting with
          # "::") must not reach the runner, so the log copy goes out between stop-commands markers made
          # after the audit has finished; the summary copy is HTML-escaped so nothing in it renders.
          show_report() {
            token=$(python -c "import secrets; print(secrets.token_hex(16))")
            echo "::stop-commands::$token"
            cat audit_report.txt
            echo "::$token::"
            python -c "import html; print('<pre>' + html.escape(open('audit_report.txt', encoding='utf-8', errors='replace').read()) + '</pre>')" >> "$GITHUB_STEP_SUMMARY"
          }
          echo "### strategies/baseline_flow.py (reference, does not gate CI)" >> "$GITHUB_STEP_SUMMARY"
          python -m src.audit strategies/baseline_flow.py > audit_report.txt 2>&1 || true
          show_report

  container:
    name: Strategy sandbox isolation (Docker)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Build the sandbox image
        run: docker build -t oqs-sandbox .

      - name: Strategy process in the container cannot read data or reach the network
        env:
          OQS_CONTAINER_IMAGE: oqs-sandbox
        run: python -m pytest -v tests -k "isolation or bar_by_bar"
